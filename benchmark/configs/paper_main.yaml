models:
  - ssd300
  - fasterrcnn
  - yolov5

dataset:
  voc_root: data/VOCdevkit/VOC2012
  split: val
  class_map_version: VOC20

image_size:
  policy: model_native
batch_size: 1
conf_threshold: 0.25
nms_threshold: 0.45
iou_thresholds_ap: [0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95]
precision_recall_match_iou: 0.5

device: cuda
warmup_runs: 5
benchmark_runs: 100
comparison_images_path: comparison_images.json

random_seed: 42
output_root: results
run_name: paper_main
save_predictions: true
save_visualizations: true

model_configs:
  ssd300:
    pretrained: true
  fasterrcnn:
    pretrained: true
  yolov5:
    weights: yolov5su.pt
